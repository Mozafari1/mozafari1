<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Rahmat Mozafari, founder of Inovix">
  <rect width="900" height="240" fill="#F8FAFC"/>
  <g stroke="#0F172A" stroke-opacity="0.05" stroke-width="1"><line x1="0" y1="0" x2="0" y2="240"/><line x1="30" y1="0" x2="30" y2="240"/><line x1="60" y1="0" x2="60" y2="240"/><line x1="90" y1="0" x2="90" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="150" y1="0" x2="150" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/><line x1="210" y1="0" x2="210" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/><line x1="270" y1="0" x2="270" y2="240"/><line x1="300" y1="0" x2="300" y2="240"/><line x1="330" y1="0" x2="330" y2="240"/><line x1="360" y1="0" x2="360" y2="240"/><line x1="390" y1="0" x2="390" y2="240"/><line x1="420" y1="0" x2="420" y2="240"/><line x1="450" y1="0" x2="450" y2="240"/><line x1="480" y1="0" x2="480" y2="240"/><line x1="510" y1="0" x2="510" y2="240"/><line x1="540" y1="0" x2="540" y2="240"/><line x1="570" y1="0" x2="570" y2="240"/><line x1="600" y1="0" x2="600" y2="240"/><line x1="630" y1="0" x2="630" y2="240"/><line x1="660" y1="0" x2="660" y2="240"/><line x1="690" y1="0" x2="690" y2="240"/><line x1="720" y1="0" x2="720" y2="240"/><line x1="750" y1="0" x2="750" y2="240"/><line x1="780" y1="0" x2="780" y2="240"/><line x1="810" y1="0" x2="810" y2="240"/><line x1="840" y1="0" x2="840" y2="240"/><line x1="870" y1="0" x2="870" y2="240"/><line x1="900" y1="0" x2="900" y2="240"/><line x1="0" y1="0" x2="900" y2="0"/><line x1="0" y1="30" x2="900" y2="30"/><line x1="0" y1="60" x2="900" y2="60"/><line x1="0" y1="90" x2="900" y2="90"/><line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="180" x2="900" y2="180"/><line x1="0" y1="210" x2="900" y2="210"/><line x1="0" y1="240" x2="900" y2="240"/></g>
  <rect x="0" y="0" width="5" height="240" fill="#2563EB"/>

  <!-- Navnet kommer inn én gang per runde. Kort og dempet: det skal
       kjennes som at siden lastes, ikke som at noe blinker. -->
  <g>
    <text x="54" y="104" fill="#0F172A" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1.1">Rahmat Mozafari</text>
    <animateTransform attributeName="transform" type="translate" values="-7 0;0 0;0 0;0 0" keyTimes="0;0.07;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.06;0.9;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Streken tegnes fra venstre, rett etter navnet. -->
  <rect x="56" y="120" width="48" height="3" rx="1.5" fill="#2563EB">
    <animate attributeName="width" values="0;48;48;48" keyTimes="0;0.12;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="56" y="152" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">founder of Inovix. we build for clients, and for ourselves.</text>
  <rect x="522" y="150" width="8" height="2.5" rx="1.25" fill="#2563EB">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.52;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="613" cy="108" r="15" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="2"/><circle cx="613" cy="108" r="15" fill="none" stroke="#2563EB" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.20;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><circle cx="613" cy="108" r="3.4" fill="#64748B" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.10;0.20;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><text x="613" y="142" fill="#64748B" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle">nordcrm</text><circle cx="671" cy="108" r="15" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="2"/><circle cx="671" cy="108" r="15" fill="none" stroke="#2563EB" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.30;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><circle cx="671" cy="108" r="3.4" fill="#64748B" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.20;0.30;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><text x="671" y="142" fill="#64748B" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle">cashlite</text><circle cx="729" cy="108" r="15" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="2"/><circle cx="729" cy="108" r="15" fill="none" stroke="#2563EB" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.40;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><circle cx="729" cy="108" r="3.4" fill="#64748B" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.30;0.40;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><text x="729" y="142" fill="#64748B" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle">venito</text><circle cx="787" cy="108" r="15" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="2"/><circle cx="787" cy="108" r="15" fill="none" stroke="#2563EB" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.50;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><circle cx="787" cy="108" r="3.4" fill="#64748B" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.40;0.50;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><text x="787" y="142" fill="#64748B" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle">peskot</text><circle cx="845" cy="108" r="15" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="2"/><circle cx="845" cy="108" r="15" fill="none" stroke="#2563EB" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.60;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><circle cx="845" cy="108" r="3.4" fill="#64748B" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.5;0.5;1;1;0.5;0.5" keyTimes="0;0.50;0.60;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </circle><text x="845" y="142" fill="#64748B" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle">delbarme</text>
